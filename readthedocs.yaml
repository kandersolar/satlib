# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

sphinx:
    configuration: docs/sphinx/source/conf.py

build:
   os: ubuntu-lts-latest
   tools:
     python: "3.13"

python:
   install:
      - method: pip
        path: .
        extra_requirements:
          - doc
